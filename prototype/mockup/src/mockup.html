<style>
@font-face { font-family: "Pretendard"; src: url("__FONT__") format("woff"); font-weight: 45 920; font-style: normal; font-display: swap; }
/* 토큰: docs/03-ui-style.md 임시값 (D-046). 라이트/다크 미지원 → 어두운 단일 테마 */

  --bg-base: #0E1220;
  --bg-panel: #171C2E;
  --bg-panel-2: #1E2439;

  --line-soft: rgba(236, 230, 214, 0.12);

  --text-muted: #9A97A6;
  --accent: #C9A45C;

  --danger: #C0392B;
  --miracle: #F4D77A;
  --cond-full: #5FAF7A; --cond-hurt: #D9A441; --cond-danger: #C0392B;
  --aff-hostile: #B03A3A; --aff-wary: #C9803A; --aff-neutral: #9A97A6; --aff-friendly: #6FA8DC; --aff-loyal: #C9A45C;

html, body { height: 100%; }

button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

#app { position: relative; height: 100%; max-width: 1180px; margin: 0 auto; padding-inline: 16px; box-sizing: border-box; display: flex; flex-direction: column; }
.screen { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.mock-chip { position: absolute; top: 8px; right: 16px; z-index: 50; font-size: 11px; letter-spacing: .02em; color: var(--text-muted); border: 1px solid var(--line-soft); border-radius: 999px; padding: 3px 9px; background: rgba(14,18,32,.7); }

.btn { border: 1px solid var(--line); background: var(--bg-panel); border-radius: 6px; padding: 10px 16px; cursor: pointer; font-weight: 600; transition: background .15s, border-color .15s; }

/* ───────── 메인 ───────── */
#s-main { justify-content: center; align-items: center; text-align: center; overflow: hidden; }
.main-bg { position: absolute; inset: 0 -16px; background-size: cover; background-position: center; opacity: .22; filter: saturate(.6) blur(1px); }
.main-bg::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(14,18,32,.2) 0%, var(--bg-base) 75%); }

.title { font-weight: 800; font-size: clamp(38px, 10.5vw, 72px); line-height: 1.05; margin: 0; letter-spacing: -.02em; text-wrap: balance; }

/* ───────── 소환 ───────── */
#s-summon { align-items: center; overflow-y: auto; padding-block: 44px 200px; }
#summon-canvas { width: min(78vw, 420px); aspect-ratio: 1; max-width: 100%; }
.catalyst { width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 14px; }
.catalyst h2 { font-weight: 700; font-size: 20px; margin: 0; }
.catalyst p { margin: 0; color: var(--text-muted); line-height: 1.6; }
.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.cat-item { display: flex; align-items: center; gap: 12px; text-align: left; background: var(--bg-panel); border: 1px solid var(--line-soft); border-radius: 6px; padding: 10px 12px; cursor: pointer; }
.cat-item:hover { border-color: var(--accent); }
.cat-item b { display: block; font-weight: 700; }
.cat-item span { font-size: 12px; color: var(--text-muted); }
.reveal { width: 100%; max-width: 760px; display: grid; gap: 18px; grid-template-columns: 1fr; }
@media (min-width: 760px) { .reveal { grid-template-columns: 260px 1fr; align-items: start; } }
.card { position: relative; aspect-ratio: 2/3; max-width: 260px; width: 100%; margin: 0 auto; border-radius: 10px; background: linear-gradient(160deg, var(--cls) 0%, #0b0e18 78%); border: 1px solid var(--line); display: flex; flex-direction: column; justify-content: space-between; padding: 18px; box-sizing: border-box; overflow: hidden; animation: flip .9s cubic-bezier(.2,.8,.2,1) both; }
@keyframes flip { from { transform: perspective(900px) rotateY(180deg) scale(.8); opacity: 0; } to { transform: none; opacity: 1; } }
.card .big { font-family: var(--crest); font-weight: 900; font-size: 120px; line-height: 1; color: rgba(255,255,255,.9); text-align: center; margin-top: 18px; text-shadow: 0 0 30px rgba(244,215,122,.35); }
.card .cls { font-size: 12px; letter-spacing: .35em; color: rgba(255,255,255,.75); text-align: center; }
.card .nm { font-weight: 700; font-size: 20px; text-align: center; }

.sheet { display: flex; flex-direction: column; gap: 14px; }
.sheet h3 { margin: 0; font-size: 24px; font-weight: 800; }
.sheet .sub { color: var(--text-muted); font-size: 13px; margin-top: 4px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line-soft); border: 1px solid var(--line-soft); border-radius: 6px; overflow: hidden; margin: 0; }
.stats div { background: var(--bg-panel); padding: 8px 10px; display: flex; justify-content: space-between; align-items: baseline; }
.stats dt { color: var(--text-muted); font-size: 12px; }
.stats dd { margin: 0; font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums; }
.stats dd small { font-weight: 400; font-size: 11px; color: var(--text-muted); margin-left: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; border: 1px solid var(--line-soft); border-radius: 999px; padding: 3px 10px; background: var(--bg-panel); }
.np { border-left: 2px solid var(--accent); padding: 4px 0 4px 12px; font-weight: 600; }
.np small { display: block; font-weight: 400; color: var(--text-muted); font-size: 12px; }
.summon-next { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.summon-next p { margin: 0; font-size: 12px; color: var(--text-muted); }

/* ───────── 맵 ───────── */
#s-map { padding-block: 40px 0; gap: 10px; }
.hud { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
.hud-day { font-weight: 800; font-size: 20px; display: flex; align-items: center; gap: 10px; }
.pips { display: inline-flex; gap: 4px; }
.pips i { width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--accent); }
.pips i.on { background: var(--accent); }
.hud-right { display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; }
.seal { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); }
.seal img { width: 34px; height: 34px; }
.meter { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; font-size: 12px; color: var(--text-muted); }
.meter .bar { position: relative; width: 72px; height: 7px; background: var(--bg-panel-2); border-radius: 4px; overflow: hidden; }
.meter .bar b { position: absolute; inset: 0 auto 0 0; transition: width .6s ease, background .6s; }
.meter .bar .tick { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(14,18,32,.9); }
.meter.mana .bar b { background: linear-gradient(90deg, #6aa0ff, #b69cff); }
.meter .val { color: var(--text-primary); }
.tag { font-size: 12px; padding: 2px 8px; border-radius: 4px; border: 1px solid currentColor; }
.tag.full { color: var(--cond-full); } .tag.hurt { color: var(--cond-hurt); } .tag.danger { color: var(--cond-danger); }
.map-layout { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr; gap: 14px; align-content: start; }
@media (min-width: 900px) { .map-layout { grid-template-columns: minmax(0, 1fr) 300px; align-content: stretch; } }
.map-wrap { position: relative; width: min(100%, calc(100dvh - 260px)); aspect-ratio: 1; margin: 0 auto; border-radius: 4px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
@media (min-width: 900px) { .map-wrap { width: min(100%, calc(100dvh - 150px)); } }
.map-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity .8s; }
.map-grid { position: absolute; inset: 1.4%; display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 1fr); }
.tile { border: 0; background: transparent; cursor: pointer; position: relative; padding: 0; transition: background .5s; }
.tile.adj::after { content: ""; position: absolute; inset: 6%; border: 2px dashed var(--accent); border-radius: 4px; background: rgba(201,164,92,.14); animation: breathe 1.6s ease-in-out infinite; }
.tile.fog { background: rgba(8, 10, 20, .42); }
@keyframes breathe { 50% { background: rgba(201,164,92,.26); } }
.token { position: absolute; width: 11%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; display: grid; place-items: center; font-family: var(--crest); font-weight: 900; font-size: clamp(12px, 3.2vw, 20px); color: #fff; background: var(--cls); box-shadow: 0 0 0 2px #fff, 0 4px 12px rgba(0,0,0,.6); pointer-events: none; transition: left .7s cubic-bezier(.4,0,.2,1), top .7s cubic-bezier(.4,0,.2,1), opacity .5s; }
.token.enemy { background: #2a1d24; box-shadow: 0 0 0 2px var(--danger), 0 0 18px rgba(192,57,43,.6); font-family: var(--font); }
.token.walking { animation: hop .35s ease-in-out 2; }
@keyframes hop { 50% { transform: translate(-50%, -62%); } }
.tile-info { position: absolute; left: 8px; bottom: 8px; font-size: 12px; background: rgba(11,14,24,.85); border: 1px solid var(--line-soft); border-radius: 4px; padding: 4px 8px; }
.hint { font-size: 12px; color: var(--miracle); text-align: center; margin: 6px 0 0; min-height: 16px; }
.side { display: none; flex-direction: column; gap: 12px; min-height: 0; }
@media (min-width: 900px) { .side { display: flex; } }
.panel { background: var(--bg-panel); border: 1px solid var(--line-soft); border-radius: 6px; padding: 12px 14px; }
.panel h4 { margin: 0 0 8px; font-size: 11px; letter-spacing: .12em; color: var(--text-muted); font-weight: 600; }
.me { display: flex; gap: 10px; align-items: center; }
.me b { font-size: 16px; }
.intel ul, .log ul { list-style: none; margin: 0; padding: 0; }
.intel li { display: flex; justify-content: space-between; font-size: 13px; padding-block: 3px; }
.intel li span { color: var(--text-muted); font-size: 12px; }
.log { flex: 1; min-height: 120px; overflow-y: auto; }
.log li { font-size: 13px; line-height: 1.6; padding-block: 3px; border-bottom: 1px solid var(--line-soft); }
.log li b { font-size: 11px; color: var(--accent); margin-right: 6px; }
.actions { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
.act { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 64px; padding: 8px 2px; border-radius: 8px; background: var(--bg-panel); border: 1px solid var(--line-soft); cursor: pointer; font-size: 12px; font-weight: 600; line-height: 1.2; text-align: center; word-break: keep-all; }
.act .k { font-size: 22px; line-height: 1; }
.act.on { border-color: var(--accent); background: var(--bg-panel-2); box-shadow: inset 0 0 0 1px var(--accent); }
.act.dim { opacity: .38; }
.act-why { font-size: 12px; color: var(--cond-hurt); text-align: center; min-height: 16px; margin: 0; }

/* ───────── 전투 ───────── */
#s-battle { padding-block: 40px 0; padding-bottom: var(--vn-space); gap: 10px; box-sizing: border-box; }
.bhead { text-align: center; }
.bhead b { display: block; font-weight: 800; font-size: 17px; }
.bhead span { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.arena { flex: 1; min-height: 0; display: grid; gap: 10px; padding-bottom: 10px; grid-template-columns: 1fr 1fr; grid-template-rows: auto minmax(110px, 1fr); grid-template-areas: "a c" "tray tray"; }
@media (min-width: 900px) { .arena { grid-template-columns: 1fr minmax(260px, 340px) 1fr; grid-template-rows: 1fr; grid-template-areas: "a tray c"; } }
.fcard { position: relative; background: var(--bg-panel); border: 1px solid var(--line-soft); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px; transition: border-color .8s, box-shadow .8s, background .8s; min-width: 0; }
.fcard.a { grid-area: a; } .fcard.c { grid-area: c; }
.fcard .who { display: flex; align-items: center; gap: 10px; min-width: 0; transition: opacity .8s; }
.fcard .who .glyph { width: 38px; height: 38px; font-size: 18px; }
.fcard .nm { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fcard .cls { font-size: 11px; color: var(--text-muted); }
.cond { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
.cond i { height: 10px; border-radius: 2px; background: var(--bg-panel-2); transition: background .5s; }
.cond-lbl { display: grid; grid-template-columns: repeat(3, 1fr); font-size: 10px; color: var(--text-muted); text-align: center; margin-top: -6px; }
.cond-lbl .cur { color: var(--text-primary); font-weight: 700; }
.math { display: grid; gap: 4px; font-size: 13px; font-variant-numeric: tabular-nums; min-height: 76px; align-content: start; }
.math .ln { display: flex; justify-content: space-between; align-items: center; gap: 6px; opacity: 0; transform: translateY(4px); transition: opacity .35s, transform .35s; }
.math .ln.in { opacity: 1; transform: none; }
.math .ln span:last-child { font-weight: 700; }
.math .mir { color: var(--miracle); }
.dchip { display: inline-grid; place-items: center; min-width: 22px; height: 22px; border-radius: 4px; background: #EDE5D0; color: #1B1622; font-weight: 800; font-size: 13px; margin-right: 3px; }
.total { display: flex; align-items: baseline; justify-content: space-between; border-top: 1px solid var(--line-soft); padding-top: 8px; margin-top: auto; }
.total small { font-size: 11px; color: var(--text-muted); }
.total b { font-weight: 800; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; transition: color .8s, transform .5s; }
.fcard.win { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 28px rgba(201,164,92,.35); background: linear-gradient(180deg, rgba(201,164,92,.12), var(--bg-panel) 60%); }
.fcard.win .total b { color: var(--accent); transform: scale(1.12); transform-origin: right; }
.fcard.lose { border-color: rgba(192,57,43,.6); }
.fcard.lose .total b { color: var(--danger); }
.fcard.lose .who { opacity: .7; }
.fcard.hit { animation: hit .6s; }
@keyframes hit { 20% { transform: translateX(-5px); filter: brightness(1.8); } 45% { transform: translateX(5px); } }
.tray { grid-area: tray; position: relative; min-height: 110px; border-radius: 10px; overflow: hidden; background: radial-gradient(ellipse at 50% 60%, #19203a 0%, #0c1020 80%); border: 1px solid var(--line-soft); touch-action: none; }
.tray canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; }
.verdict { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); z-index: 2; font-size: 12px; font-weight: 700; background: rgba(11,14,24,.92); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; white-space: nowrap; opacity: 0; transition: opacity .5s; }
.verdict.in { opacity: 1; }
.roll-cta { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.roll-cta p { margin: 0; font-size: 12px; color: var(--text-muted); animation: nudge 1.6s ease-in-out infinite; white-space: nowrap; }
@keyframes nudge { 50% { transform: translateY(-4px); } }
.edge-flash { position: absolute; inset: 0; z-index: 1; pointer-events: none; box-shadow: inset 0 0 70px 8px var(--miracle); opacity: 0; }
.edge-flash.on { animation: edge 1.4s ease-out; }
@keyframes edge { 15% { opacity: .95; } 100% { opacity: 0; } }
.fallback-dice { position: absolute; inset: 0; display: grid; place-items: center; font-size: 44px; font-weight: 800; }

/* ───────── VN 텍스트박스 ───────── */
.vn { position: absolute; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--bg-textbox); border-top: 1px solid var(--line); padding: 14px 16px calc(12px + env(safe-area-inset-bottom, 0px)); box-sizing: border-box; height: var(--vn-space); display: flex; flex-direction: column; gap: 8px; cursor: pointer; backdrop-filter: blur(4px); }
@media (min-width: 900px) { .vn { padding-inline: 32px; } }
.vn .who { font-weight: 700; font-size: 13px; color: var(--accent); letter-spacing: .02em; min-height: 18px; }
.vn .txt { font-size: var(--fs-vn); line-height: 1.75; flex: 1; overflow-y: auto; max-width: 62ch; }
.vn .txt.narr { color: #d9d3c4; }
.vn .ctrl { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-muted); }
.vn .ctrl .l { display: flex; gap: 6px; }
.vn .ctrl button { background: transparent; border: 1px solid var(--line-soft); border-radius: 4px; padding: 3px 8px; cursor: pointer; font-size: 11px; color: var(--text-muted); }
.vn .ctrl button.on { color: var(--accent); border-color: var(--accent); }
.vn .next { color: var(--accent); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.choices { position: absolute; left: 0; right: 0; bottom: calc(var(--vn-space) + 10px); z-index: 25; display: flex; flex-direction: column; align-items: center; gap: 8px; padding-inline: 16px; }
.choices.low { bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
.choices .q { font-size: 14px; font-weight: 600; background: rgba(11,14,24,.92); padding: 6px 12px; border-radius: 4px; }
.choices .btn { width: min(360px, 100%); }
.choices .why { font-size: 12px; color: var(--cond-hurt); min-height: 16px; text-align: center; }

.modal { position: absolute; inset: 0; z-index: 40; background: rgba(8,10,18,.72); display: grid; place-items: center; padding: 16px; }
.modal .box { background: var(--bg-panel); border: 1px solid var(--line); border-radius: 8px; padding: 20px; width: min(440px, 100%); display: flex; flex-direction: column; gap: 12px; max-height: 80%; overflow-y: auto; box-sizing: border-box; }
.modal h3 { margin: 0; font-size: 20px; font-weight: 800; }
.modal p { margin: 0; color: var(--text-muted); line-height: 1.6; }
.modal .row { display: flex; gap: 8px; flex-wrap: wrap; }
.loglist { margin: 0; padding: 0; }
.loglist li { font-size: 14px; line-height: 1.6; border-bottom: 1px solid var(--line-soft); padding-block: 6px; list-style: none; }
.loglist b { font-size: 11px; color: var(--accent); display: block; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>

/* ───────── 마법진 (소환 캔버스 + 다이스 테이블) ───────── */

/* ───────── 3D 다이스 (2d10, 오각 사다리꼴면체) ───────── */

async function startBattle() {
  show('s-battle'); Dice.init(); Dice.resize(); B.a = Game.cond; B.c = 'full'; renderFighters(); resetRound();
  const i0 = DATA.steps.findIndex((s) => s.type === 'beat' && s.title.startsWith('조우'));
  const i1 = DATA.steps.findIndex((s) => s.type === 'beat' && s.title.startsWith('2일차'));
  for (const s of DATA.steps.slice(i0, i1)) {
    if (s.type === 'beat') { if (/국면 \d 시작/.test(s.title)) resetRound(); await VN.play(beatLines(s)); }
    else if (s.type === 'dice') await diceStep(s);
    else if (s.type === 'cond') { B[s.side] = s.to; fcard(s.side); const el = $('f-' + s.side); el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit'); await wait(700); }
    else if (s.type === 'prompt' && s.kind === 'crisis') {
      await choices(`${Game.me.name}, 위험. 마스터의 판단은?`, [
        { label: '영주: 판정 +5', value: 'buff', blocked: '목업에서는 방관만 진행합니다. 영주 버프 지속 범위 미정 (Q-122)' },
        { label: '영주: 보구 즉시 발동', value: 'np', blocked: '목업에서는 방관만 진행합니다.' },
        { label: '방관한다', value: 'watch', primary: true },
      ], true);
    } else if (s.type === 'prompt' && s.kind === 'np') {
      resetRound(); $('ph-name').textContent = '보구 개방'; $('ph-no').textContent = '국면 3 / 3';
      await choices('마력 80. 보구를 개방할 수 있다.', [
        { label: '보구 개방 (마력 80 → 30)', value: 'open', primary: true },
        { label: '보류', value: 'hold', blocked: '목업 대본은 개방 분기만 있습니다.' },
      ], true);
    } else if (s.type === 'mana') { Game.mana = s.to; }
    else if (s.type === 'seal') { $('ph-name').textContent = '영주 도주'; }
  }
  Game.cond = B.a;
  await choices('전투 종료 · 랜서가 영주로 도주했다', [{ label: '다음 날로', value: 1, primary: true }], true);
  Game.cond = { danger: 'hurt', hurt: 'full', full: 'full' }[Game.cond];
  Game.day = 2; Game.time = 'day'; Game.acts = 3; Game.enemyPos = null; Game.mana = Math.min(100, Game.mana + 40);
  show('s-map'); renderMap();
  await VN.play(beatLines(beat('2일차')));
  Modal.open(`<h3>목업은 여기까지</h3><p>2일차 아침. ${Game.me.name}의 상태가 밤사이 한 단계 회복되어 <b>${COND_KO[Game.cond]}</b>이 되었고, 마력은 밤 회복 +40을 받았다.</p><p>대사·나레이션은 전부 데이터 파일의 초안(draft)이며, 전투 대본은 서술 시뮬레이터(시드 ${DATA.seed}) 출력이다.</p><div class="row"><button class="btn primary" id="btn-again">처음부터</button><button class="btn" data-close>맵 둘러보기</button></div>`);
  $('btn-again').onclick = () => location.reload();
}
// 합산 연출 중 경기장을 누르면 빠르게 넘어간다
$('arena').addEventListener('click', (e) => { if (!e.target.closest('button')) FAST = true; });

async function enterMap() { show('s-map'); renderMap(); await VN.play(beatLines(beat('1일차 아침'))); }
</script>
